services:
  postgres:
    image: postgres:16-alpine
    container_name: nhc-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: nhc_dev
      POSTGRES_USER: nhc_user
      POSTGRES_PASSWORD: nhc_dev_password
    volumes:
      - nhc_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nhc_user -d nhc_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  nhc_postgres_data:
